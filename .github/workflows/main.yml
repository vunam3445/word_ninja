
name: Build Word Ninja Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: word-ninja-vocab-spawn-fix

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify project layout
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f public/index.html
          echo "Project files found."

      - name: Install dependencies
        run: npm install

      - name: Prepare local web assets
        run: |
          rm -rf www
          mkdir -p www/vendor
          cp -R public/. www/
          cp node_modules/phaser/dist/phaser.min.js www/vendor/phaser.min.js
          cp node_modules/sql.js/dist/sql-wasm.js www/vendor/sql-wasm.js
          cp node_modules/sql.js/dist/sql-wasm.wasm www/vendor/sql-wasm.wasm
          test -f www/index.html
          echo "Capacitor web assets prepared in www/."

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure landscape orientation
        run: npm run android:configure

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-ninja-android-debug-apk
          path: word-ninja-vocab-spawn-fix/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
