name: Build Word Ninja Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'word-ninja-vocab-spawn-fix/**'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: word-ninja-vocab-spawn-fix

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Verify project layout
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f public/index.html

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download offline dictionary
        run: npm run android:dictionary

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Prepare offline web assets
        run: npm run android:prepare

      - name: Add Android platform
        run: npx cap add android

      - name: Configure landscape orientation
        run: npm run android:configure

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: word-ninja-android-debug-apk
          path: word-ninja-vocab-spawn-fix/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
